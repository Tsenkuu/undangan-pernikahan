<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — The Wedding of Arbian &amp; Hima</title>
  
  <link rel="icon" type="image/jpeg" href="assets/images/bride-avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --mahogany: #4d151c;
      --mahogany-dark: #2a0b10;
      --gold-primary: #d4af37;
      --gold-light: #f7e7b4;
      --gold-gradient: linear-gradient(135deg, #f7e7b4 0%, #d4af37 50%, #aa771c 100%);
      --text-light: #ffffff;
      --text-muted: #d6c5b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 35%, #4d151c 0%, #25080c 60%, #150305 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-light);
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Gold Shimmer Pattern */
    .bg-pattern {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(212, 175, 55, 0.15) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      opacity: 0.6;
    }

    .login-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(42, 11, 16, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 18px;
      padding: 40px 32px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(212, 175, 55, 0.18);
      animation: fadeInCard 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInCard {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-emblem {
      width: 50px;
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.5));
    }

    .login-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      color: var(--gold-light);
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      border-color: var(--gold-light);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--gold-gradient);
      color: var(--mahogany-dark);
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .alert-error {
      display: none;
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid rgba(220, 53, 69, 0.5);
      color: #ffb3b8;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: center;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--gold-light);
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .back-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>

  <div class="login-container">
    <div class="login-header">
      <!-- Javanese Gunungan Emblem SVG -->
      <svg class="login-emblem" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5C45 20 30 35 20 50C10 65 5 80 8 100C10 110 25 115 50 115C75 115 90 110 92 100C95 80 90 65 80 50C70 35 55 20 50 5Z" stroke="#d4af37" stroke-width="2.5" fill="rgba(212, 175, 55, 0.12)"/>
        <path d="M50 15C47 28 35 40 28 52C20 64 16 75 18 90C20 100 32 105 50 105C68 105 80 100 82 90C84 75 80 64 72 52C65 40 53 28 50 15Z" stroke="#f7e7b4" stroke-width="1.2" stroke-dasharray="2 2"/>
        <path d="M50 25V105M35 55C40 65 60 65 65 55M30 75C40 85 60 85 70 75M25 95C35 105 65 105 75 95" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="50" cy="18" r="3" fill="#f7e7b4"/>
      </svg>
      <h1 class="login-title">Admin Dashboard</h1>
      <p class="login-subtitle">The Wedding of Arbian &amp; Hima</p>
    </div>

    <div class="alert-error" id="loginError">
      Username atau password salah!
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" class="form-input" placeholder="Masukkan username" required autocomplete="username" autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Masukkan password" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">Masuk ke Dashboard</button>
    </form>

    <a href="/" class="back-link">&larr; Kembali ke Halaman Undangan</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('loginError');
    const btn = document.getElementById('btnLogin');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/admin';
        } else {
          errBox.textContent = data.error || 'Username atau password salah!';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Masuk ke Dashboard';
        }
      } catch (err) {
        errBox.textContent = 'Terjadi kesalahan koneksi server.';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Masuk ke Dashboard';
      }
    });
  </script>

</body>
</html>
